name: app-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck is the contract-drift gate: frontend API types are generated
      # from the backend OpenAPI spec, so a backend field rename surfaces here.
      - name: Typecheck
        run: npm run typecheck
